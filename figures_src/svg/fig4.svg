<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 432" width="460" height="432" font-family="'Times New Roman','Liberation Serif',serif" role="img" aria-label="Rule-based EMS decision logic for one time step"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L8,4 L0,7.5 z" fill="#111"/></marker></defs><rect x="0" y="0" width="460" height="432" fill="#fff"/><rect x="172.0" y="2.0" width="116" height="24" rx="12.0" fill="#1f2d3d"/><text x="230" y="18.42" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Start of time step t</text><path d="M230,26 L230,40" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="14" y="40" width="432" height="36" rx="3" fill="#d6e8f5" stroke="#111" stroke-width="1.2"/><text x="230.0" y="55.25" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111">Read PV power, fixed load, battery energy, tariff,</text><text x="230.0" y="69.25" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111">peak window and appliance windows</text><path d="M230,76 L230,90" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M115,90 L345,90" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M115,90 L115,106" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M345,90 L345,106" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/><polygon points="115,106.0 218.0,148 115,190.0 12.0,148" fill="#fbefcc" stroke="#111" stroke-width="1.2"/><text x="115" y="137.75" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111">Appliance not yet</text><text x="115" y="152.25" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111">started and inside</text><text x="115" y="166.75" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111">its window?</text><polygon points="345,106.0 448.0,148 345,190.0 242.0,148" fill="#fbefcc" stroke="#111" stroke-width="1.2"/><text x="345" y="145" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111">Net power</text><text x="345" y="159.5" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111">PV − load > 0 ?</text><path d="M115,190 L115,200" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M61,200 L169,200" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M345,190 L345,200" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M291,200 L399,200" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M61,200 L61,222" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/><text x="65" y="214" text-anchor="start" font-size="12" font-weight="normal" fill="#111">Yes</text><path d="M169,200 L169,222" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/><text x="173" y="214" text-anchor="start" font-size="12" font-weight="normal" fill="#111">No</text><path d="M291,200 L291,222" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/><text x="295" y="214" text-anchor="start" font-size="12" font-weight="normal" fill="#111">Yes</text><path d="M399,200 L399,222" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/><text x="403" y="214" text-anchor="start" font-size="12" font-weight="normal" fill="#111">No</text><rect x="4" y="222" width="110" height="98" rx="3" fill="#e4d3ea" stroke="#111" stroke-width="1.2"/><text x="59.0" y="241.33" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">Start if PV surplus</text><text x="59.0" y="254.83" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">≥ 70 % of rating,</text><text x="59.0" y="268.33" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">or off-peak and</text><text x="59.0" y="281.83" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">SOC ≥ 60 %, or</text><text x="59.0" y="295.33" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">deadline reached</text><text x="59.0" y="308.83" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">(EV: 50 %, 80 %)</text><rect x="116" y="222" width="104" height="98" rx="3" fill="#ececec" stroke="#111" stroke-width="1.2"/><text x="168.0" y="254.83" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">Hold the</text><text x="168.0" y="268.33" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">appliance</text><text x="168.0" y="281.83" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">for a later</text><text x="168.0" y="295.33" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">step</text><rect x="234" y="222" width="110" height="98" rx="3" fill="#e2eed2" stroke="#111" stroke-width="1.2"/><text x="289.0" y="254.83" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">Charge battery</text><text x="289.0" y="268.33" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">from the surplus</text><text x="289.0" y="281.83" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">(max 5 kW, up</text><text x="289.0" y="295.33" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">to 100 % SOC)</text><rect x="346" y="222" width="110" height="98" rx="3" fill="#e2eed2" stroke="#111" stroke-width="1.2"/><text x="401.0" y="248.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">Discharge in the</text><text x="401.0" y="261.58" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">peak window, if</text><text x="401.0" y="275.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">SOC > 80 %, or (v2)</text><text x="401.0" y="288.58" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">if forecast PV</text><text x="401.0" y="302.08" text-anchor="middle" font-size="12" font-weight="normal" fill="#111">≥ 25 kWh (to 20 %)</text><path d="M61,320 L61,338" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M168,320 L168,338" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M291,320 L291,338" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M399,320 L399,338" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M61,338 L399,338" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/><path d="M230,338 L230,352" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="14" y="352" width="432" height="40" rx="3" fill="#d6e8f5" stroke="#111" stroke-width="1.2"/><text x="230.0" y="369.25" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111">Grid power = load + battery − PV; import × tariff,</text><text x="230.0" y="383.25" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#111">or export × 10.5 PKR/kWh; add to the daily cost</text><path d="M230,392 L230,406" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="172.0" y="406.0" width="116" height="24" rx="12.0" fill="#1f2d3d"/><text x="230" y="422.42" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Next time step</text></svg>